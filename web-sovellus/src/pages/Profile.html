<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="stylesheet" href="/src/css/style.css" />
    <link rel="stylesheet" href="/src/css/login.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite App</title>
  </head>
  <body>
    <section class="entirePage">
      <section class="SearchBar">
        <h1 id="pageTitle">Jeff United</h1>
        <ul class="headings">
          <li class="headingLinks">
            <a class="heading" href="/"><h1>Home</h1></a>
          </li>
          <li class="headingLinks">
            <a class="heading" href="BMI.html"><h1>BMI</h1></a>
          </li>
          <li class="headingLinks">
            <a class="heading" href="Entries.html"><h1>Entries</h1></a>
          </li>
          <li class="headingLinks">
            <a id="position" class="heading" href="/src/pages/Profile.html"
              ><h1>Profile</h1></a
            >
          </li>
          <li class="headingLinks">
            <a class="heading" href="Login.html"><h1>Login</h1></a>
          </li>
        </ul>
      </section>
      <section class="pageContent">
        <div>
          <h1>
            Update user info. If unsure about user id go to entries and search
            users.
          </h1>
          <form class="updateform">
            <input
              id="userId"
              type="number"
              name="userId"
              placeholder="My userId"
            />
            <input
              id="username"
              type="text"
              name="username"
              placeholder="My username"
            />
            <input
              id="password"
              type="password"
              name="password"
              placeholder="My password"
            />
            <input
              id="email"
              type="email"
              name="email"
              placeholder="myemail@example.com"
            />
            <input
              name="submit"
              type="submit"
              value="Update user"
              class="formpost"
            />
          </form>
        </div>
      </section>
      <dialog class="info_dialog">
        <p></p>
        <button autofocus>Close</button>
      </dialog>
    </section>
    <script type="module" src="/src/js/updateUser.js"></script>
  </body>
</html>
