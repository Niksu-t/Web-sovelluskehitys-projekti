<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="stylesheet" href="/src/css/style.css" />
    <link rel="stylesheet" href="/src/css/bmi.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite App</title>
  </head>
  <body>
    <section class = "entirePage">
    <section class="SearchBar">
      <h1 id="pageTitle">Jeff United</h1>
      <ul class="headings">
        <li class="headingLinks">
          <a class="heading" href="/"><h1>Home</h1></a>
        </li>
        <li class="headingLinks">
          <a id="position" class="heading" href="BMI.html"><h1>BMI</h1></a>
        </li>
        <li class="headingLinks">
          <a class="heading" href="Entries.html"><h1>Entries</h1></a>
        </li>
        <li class="headingLinks">
          <a class="heading" href="/src/pages/Profile.html"><h1>Profile</h1></a>
        </li>
        <li class="headingLinks">
          <a class="heading" href="Login.html"><h1>Login</h1></a>
        </li>
      </ul>
      <button id = "logOut">Log out</button>
    </section>
    <section id="BMIlaskuriBox">
      <div class="BMIcontent">
        <img src="../imgs/BMI.png" />
        <h1 id="bmiHeader">Body mass index / BMI Calculator</h1>
        <p id="bmiText">
          You can calculate BMI below (BMI, Body Mass Index).
        </p>
        <div id="inputs">
          <label for="weight">Weight:</label>
          <input type="number" id="weight" name="weight" placeholder="Kg" />
          <label for="height">Height:</label>
          <input type="number" id="height" name="height" placeholder="Cm" />
          <button id="bmiButton">Calculate</button>
        </div>
        <p id="resultNum">Results:</p>
        <table>
          <tr id="underWeight">
            <td>Under Weight</td>
            <td>0-18.9</td>
          </tr>
          <tr id="normalWeight">
            <td>Normal</td>
            <td>19-24.9</td>
          </tr>
          <tr id="overWeight">
            <td>Overweight or obese</td>
            <td>25-40.0 or more</td>
          </tr>
        </table>
        <p id="results">Analysis:</p>
      </div>
    </section>
    </section>
    <script src="../js/BMI.js"></script>
    <script>
      const logOut = () => {
        localStorage.removeItem("token")
      }

      const logOutbutton = document.getElementById("logOut");
      logOutbutton.addEventListener("click", logOut);

    </script>
    <footer>Copyright, Niko Tiesmäki</footer>
  </body>
</html>
